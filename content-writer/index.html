<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Writer Studio · RackerWeb</title><link rel="stylesheet" href="studio.css"></head>
<body><header><a href="../index.html">RackerWeb</a><h1>Content Writer Studio</h1><span id="status" role="status" aria-live="polite">Soạn nội dung trên thiết bị này</span></header>
<main><aside><label>Website<select id="site"></select></label><label>Trang<select id="page"></select></label><a id="open-site" target="_blank" rel="noopener">Mở trang website</a><p id="industry"></p><label>Thông tin đã xác nhận<textarea id="brief" rows="6" placeholder="Sản phẩm, đối tượng khách hàng, ưu điểm, giá và kênh liên hệ thực tế"></textarea></label><label>Giọng văn<select id="tone"><option value="clear">Rõ ràng</option><option value="warm">Gần gũi</option><option value="brief">Ngắn gọn</option></select></label><button id="generate">Tạo bản nháp theo ngành</button><p>Bản nháp được ghép từ mẫu cục bộ và thông tin bạn nhập.</p><button id="prompt">Sao chép prompt cho ChatGPT</button><label>Dán nội dung AI<textarea id="import-text" rows="5" placeholder="Dán văn bản hoặc JSON đã xuất từ Studio"></textarea></label><button id="import">Đưa vào trình chỉnh sửa</button></aside>
<section class="editor"><div class="toolbar"><button id="save">Lưu phiên bản</button><button id="rewrite">Viết lại theo giọng văn</button><button id="seo">Tạo SEO</button></div><label>Tiêu đề nội dung<input id="title"></label><label>Nội dung<textarea id="body" rows="17"></textarea></label><div class="seo"><label>SEO title<input id="seo-title" maxlength="100"></label><label>SEO description<textarea id="seo-description" rows="3" maxlength="300"></textarea></label></div><div class="toolbar"><button data-export="html">Xuất HTML</button><button data-export="json">Xuất JSON</button><button data-export="md">Xuất Markdown</button></div><details><summary>Lịch sử phiên bản trên thiết bị</summary><div id="history"></div></details></section>
<section class="preview"><h2>Xem trước</h2><article id="preview"></article><h2>Kết quả tìm kiếm</h2><div class="search-preview"><strong id="seo-preview-title"></strong><p id="seo-preview-description"></p></div></section></main><script src="../js/themes-data.js"></script><script src="catalog.js"></script><script src="studio.js"></script></body></html>
